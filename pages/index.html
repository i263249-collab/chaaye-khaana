<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f47721">
  <title>Welcome to Chaaye Khaana</title>
  <style>
    :root {
      --orange: #f47721;
      --orange-dark: #d95f12;
      --cream: #fff8f1;
      --ink: #29231f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 15%, rgba(244, 119, 33, 0.10), transparent 27%),
        radial-gradient(circle at 88% 85%, rgba(244, 119, 33, 0.10), transparent 25%),
        var(--cream);
    }

    .welcome-card {
      width: min(100%, 720px);
      min-height: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(28px, 6vw, 58px);
      text-align: center;
      background: #ffffff;
      border: 1px solid rgba(244, 119, 33, 0.18);
      border-radius: 28px;
      box-shadow: 0 18px 55px rgba(91, 54, 25, 0.10);
    }

    .eyebrow {
      margin: 0 0 24px;
      color: var(--orange-dark);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.20em;
      text-transform: uppercase;
    }

    .logo {
      display: block;
      width: clamp(190px, 48vw, 330px);
      height: auto;
      margin: 0 auto 30px;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0;
      color: var(--orange-dark);
      font-size: clamp(2rem, 6vw, 3.3rem);
      line-height: 1.12;
    }

    .message {
      max-width: 440px;
      margin: 16px 0 30px;
      color: #6c625b;
      font-size: clamp(1rem, 2.5vw, 1.12rem);
      line-height: 1.6;
    }

    .start-button {
      display: inline-block;
      padding: 15px 34px;
      color: #ffffff;
      background: var(--orange);
      border: 0;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(244, 119, 33, 0.25);
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
      cursor: pointer;
      font-family: inherit;
    }

    .start-button:hover {
      background: var(--orange-dark);
      box-shadow: 0 10px 22px rgba(244, 119, 33, 0.30);
      transform: translateY(-2px);
    }

    .start-button:focus-visible {
      outline: 3px solid rgba(244, 119, 33, 0.35);
      outline-offset: 4px;
    }

    .footer-note {
      margin: 30px 0 0;
      color: #9a8e85;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
    }

    @media (max-width: 480px) {
      .welcome-card {
        min-height: 500px;
        border-radius: 22px;
      }
    }
  </style>
</head>
